[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fbtranscript"
version = "0.1.0"
description = "Local-first Facebook video transcription API and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["yt-dlp>=2024.3.10"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2.6,<3"]
whisper = ["faster-whisper>=1.0,<2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.3", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2.6,<3"]

[project.scripts]
fbtranscript = "fbtranscript.cli:main"
fbtranscript-android = "fbtranscript.android:main"

[tool.setuptools.packages.find]
include = ["fbtranscript*"]

[tool.setuptools.package-data]
fbtranscript = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
