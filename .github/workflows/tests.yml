name: tests
on:
  push:
    branches: ["main", "implementation/**", "android/**"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q fbtranscript
      - name: Verify lightweight Android runtime imports
        run: python -c "from fbtranscript.android import Handler; print('Android stdlib runtime import OK')"
